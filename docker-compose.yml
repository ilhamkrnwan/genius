services:
  postgres:
    image: postgres:16-alpine
    container_name: genius_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: genius
      POSTGRES_PASSWORD: genius2026
      POSTGRES_DB: genius_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genius -d genius_2026"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: genius_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      HOST: "0.0.0.0"
      DATABASE_URL: "postgres://genius:genius2026@postgres:5432/genius_2026"
      JWT_SECRET: "genius-2026-super-secret-key-local-development"
      JWT_EXPIRES_IN: "24h"
    depends_on:
      postgres:
        condition: service_healthy

  user:
    build:
      context: .
      dockerfile: docker/user.Dockerfile
    container_name: genius_user
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  admin:
    build:
      context: .
      dockerfile: docker/admin.Dockerfile
    container_name: genius_admin
    restart: unless-stopped
    ports:
      - "3002:80"
    depends_on:
      - backend

  gateway:
    image: nginx:alpine
    container_name: genius_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - user
      - admin

volumes:
  postgres_data:
